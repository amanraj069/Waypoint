[project]
name = "waypoint"
version = "0.1.0"
description = "Safety-Aware Hierarchical LLM for Autonomous UAV Mission Planning and Adaptation (skeleton)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "google-genai>=2.23",
    "python-dotenv>=1.0",
    "plotly>=6.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
waypoint = "orchestrator.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner", "verifier", "sim", "feedback", "orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
