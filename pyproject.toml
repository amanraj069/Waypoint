[project]
name = "waypoint"
version = "0.1.0"
description = "Safety-Aware Hierarchical LLM for Autonomous UAV Mission Planning and Adaptation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "google-genai>=2.23",
    "python-dotenv>=1.0",
    "plotly>=6.0",
    "shapely>=2.0",
    "numpy>=1.26",          # the Gazebo terrain mesh
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # fastapi's TestClient
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
waypoint = "orchestrator.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner", "verifier", "sim", "feedback", "orchestrator", "world", "api", "gazebo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
