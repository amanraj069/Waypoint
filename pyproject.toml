[project]
name = "waypoint"
version = "0.1.0"
description = "Safety-Aware Hierarchical LLM for Autonomous UAV Mission Planning and Adaptation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "google-genai>=2.23",
    "openai>=1.60",         # the planner tries OpenAI first when OPENAI_API_KEY is set
    "python-dotenv>=1.0",
    "plotly>=6.0",
    "shapely>=2.0",
    "numpy>=1.26",          # the Gazebo terrain mesh
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # fastapi's TestClient
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
experiments = [
    "matplotlib>=3.8",      # the batch harness's plots; CSVs and summaries work without it
]
px4 = [
    "pymavlink>=2.4.40",    # --backend px4: MAVLink to PX4 SITL (PX4 and Gazebo installed separately)
]

[project.scripts]
waypoint = "waypoint.orchestrator.run_full:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waypoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
